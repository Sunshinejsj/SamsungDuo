# Builds the module on GitHub's Linux runners.
#
# This workflow builds only. It never publishes a Release:
#   * push a `v*` tag   -> build the tagged version, upload the APK as a workflow
#                          artifact (build verification)
#   * push to any branch -> build only, as a check
#
# Releases are published by the repository's own pipeline (release.ps1), which runs
# on the maintainer's machine with their own credentials. That is deliberate: a
# Release created by GitHub Actions is attributed to "github-actions[bot]", and the
# release page then shows the bot instead of the maintainer. Publishing locally
# keeps the release attributed to the repository owner, and the tag IS the version
# the in-app updater reads (releases/latest).
#
# The repository's own pipeline (release.ps1) is deliberately offline: it drives a
# local JDK and Android SDK. A runner has neither, so this workflow uses the Gradle
# build the repository already declares - it needs nothing beyond the checkout, the
# tracked .tools/maven repository and public Maven artifacts.
#
# The APK is signed with the tracked .tools/debug.keystore, the same key the
# offline pipeline uses, so it installs in place over an existing install.
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK platform 37 + build-tools
        run: |
          set -x
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          TOOLS="$(ls -1d "$SDK"/cmdline-tools/*/bin 2>/dev/null | tail -1)"
          export PATH="$TOOLS:$PATH"
          # The image already ships cmdline-tools; android-actions/setup-android is
          # not used because it insists on installing the retired "tools" package,
          # which no longer exists in the repository and fails the step outright.
          #
          # API 37 also ships as minor releases: there is no "platforms;android-37",
          # only 37.0 / 37.1 / 37.2.
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" \
            || sdkmanager --channel=3 --install "platforms;android-37.2" "build-tools;37.0.0"
          ls -1 "$SDK/platforms"
          # compileSdk 37 reads the platform directory named android-37, while the
          # package installs as android-37.<minor>: make one name point at the other
          # instead of pinning the build to whichever minor happens to be current.
          if [ ! -d "$SDK/platforms/android-37" ]; then
            minor=$(ls -1d "$SDK"/platforms/android-37.* 2>/dev/null | head -1)
            if [ -n "$minor" ]; then
              ln -sfn "$(basename "$minor")" "$SDK/platforms/android-37"
            fi
          fi
          ls -l "$SDK/platforms"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      # The tag is the version: refs/tags/v10.3 -> versionName 10.3, versionCode 103
      # (major*10 + minor, the same rule app/build.gradle.kts uses for its
      # checked-in default). A branch push has no tag, so it keeps the checked-in
      # default. The version is only stamped onto the artifact here; publishing is
      # done by release.ps1 on the maintainer's machine.
      - name: Resolve version from the tag
        id: stamp
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
            name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            code=$(( ${BASH_REMATCH[1]} * 10 + ${BASH_REMATCH[2]} ))
          else
            name=""
            code=""
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          args=(--no-daemon assembleRelease --console=plain)
          if [ -n "${{ steps.stamp.outputs.name }}" ]; then
            args+=(-PsamsungDuoVersionName="${{ steps.stamp.outputs.name }}"
                   -PsamsungDuoVersionCode="${{ steps.stamp.outputs.code }}")
          fi
          gradle "${args[@]}"

      - name: Collect
        run: |
          mkdir -p dist
          # 产物名由 build.gradle.kts 的 androidComponents 决定（SamsungDuo-<version>.apk），
          # 不再固定为 app-release.apk，这里按目录里实际生成的 apk 取。
          src="$(ls -1 app/build/outputs/apk/release/*.apk | head -n 1)"
          cp "$src" "dist/SamsungDuo-${{ steps.stamp.outputs.name || 'dev' }}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: SamsungDuo-${{ steps.stamp.outputs.name || 'dev' }}
          path: dist/*.apk
          if-no-files-found: error

      # ★ 发布不在本工作流里做（见文件头说明）：Actions 建的 Release 署名是
      #   github-actions[bot]，而 release.ps1 用仓库主人的凭据发布，署名才是主人。
      #   发版步骤：本地跑 release.ps1 -Version <版本> -NotesFile RELEASE_NOTES.md，
      #   它会构建、打 tag、建正式 Release 并上传 APK。
