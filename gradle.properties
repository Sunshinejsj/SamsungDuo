org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=37

kotlin.code.style=official

# Disable R8 full mode: full-mode string optimization rewrites reflection
# class/method-name string literals (used heavily by TrioHooks via Refl.cls),
# which breaks static verification and risks the hook layer. Plaintext strings
# are safer for a reflection-heavy Xposed module; size cost is negligible.
android.enableR8.fullMode=false
